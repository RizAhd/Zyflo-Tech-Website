<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#008B48" />

    <!-- Motion gate.
         The production site honours prefers-reduced-motion: a visitor who asked
         their OS for less movement gets a still page, which is correct.

         Locally that is unhelpful: this machine reports reduce system wide, so
         `npm run dev` would render every animation frozen and the motion work
         could never be reviewed. So on localhost and on the LAN address the
         animations default to on, and ?motion=off turns them back off if the
         reduced state itself needs checking. On a real domain nothing is forced
         unless ?motion=on is used deliberately.

         Runs during head parsing, before first paint and before the module
         script, so no frame renders in the wrong state and MOTION_OK in
         src/components/motion.tsx reads a settled attribute. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('motion')
          if (q === 'on' || q === 'off') localStorage.setItem('zyflo-motion', q)
          var pref = localStorage.getItem('zyflo-motion')
          var h = location.hostname
          var local =
            h === 'localhost' ||
            h === '127.0.0.1' ||
            h === '' ||
            /^192\.168\./.test(h) ||
            /^10\./.test(h)
          if (pref === 'on' || (local && pref !== 'off')) {
            document.documentElement.setAttribute('data-force-motion', '')
          }
        } catch (e) {}
      })()
    </script>

    <!--
      Title, description, robots, Open Graph, Twitter and the JSON-LD graph are
      injected here by the zyflo-seo plugin in vite.config.ts, generated from
      src/data/site.config.ts so they can never drift from the page copy.
      Absolute URLs (canonical, og:url, og:image) appear only once
      business.url is set to a real domain in that config file.
    -->
    <!--ZYFLO:HEAD-->

    <!-- Icons (self-hosted, generated from the logo) -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Both families are self-hosted from /public/fonts, so the page makes no
      third party request and the headline never swaps from a fallback face to
      Instrument Sans after load (that swap was part of the "loads in pieces"
      feel). The faces the first screen uses are preloaded.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-sans-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400.woff2" crossorigin />

    <style>
      /* Paint the ground before any CSS loads, which kills the flash of colour */
      html { background: #FFFFFF; }

      /* Instrument Sans is one variable file covering 400 to 700. */
      @font-face {
        font-family: 'Instrument Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/instrument-sans-latin.woff2') format('woff2');
      }

      /* Before React mounts the visitor sees a calm logo, not a page of
         unstyled text. The crawlable copy stays in the DOM, visually hidden. */
      #zyflo-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      #zyflo-splash img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        animation: zyflo-splash 1.2s ease-in-out infinite;
      }
      @keyframes zyflo-splash {
        50% { transform: scale(0.92); opacity: 0.7; }
      }
      #zyflo-static {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/inter-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/inter-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/inter-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/inter-700.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <!--
      The block inside #root is a real, readable version of the page, generated
      from src/data/site.config.ts by the zyflo-seo plugin. Crawlers that do not
      run JavaScript (GPTBot, ClaudeBot, PerplexityBot, Google-Extended) and
      screen readers read it. It is clipped out of sight rather than hidden:
      no display:none and no aria-hidden, so it stays in the accessibility tree
      and in the text a crawler extracts. With JavaScript off, the noscript rule
      below shows it as an ordinary page. React's createRoot().render() clears
      #root on mount, taking the splash and this block with it.
      Do not move it out of #root.
    -->
    <noscript>
      <style>
        #zyflo-splash { display: none !important; }
        #zyflo-static {
          position: static !important;
          width: auto !important;
          height: auto !important;
          overflow: visible !important;
          clip-path: none !important;
          white-space: normal !important;
        }
      </style>
    </noscript>
    <div id="root"><div id="zyflo-splash" aria-hidden="true"><img src="/brand/icon-192.png" alt="" width="56" height="56" /></div><!--ZYFLO:STATIC-FALLBACK--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
