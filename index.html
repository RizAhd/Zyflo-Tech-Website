<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Motion gate.
         Animation is ON for everyone by default, whatever the operating system
         reports: many Windows laptops switch "animation effects" off (battery
         saver does it too), which used to leave the whole site looking frozen.

         A visitor can still turn it off: the "Motion" button in the footer
         stores 'off', and ?motion=off does the same. That choice is remembered
         and wins over the default. ?motion=on turns it back on.

         Runs during head parsing, before first paint and before the module
         script, so no frame renders in the wrong state and MOTION_OK in
         src/components/motion.tsx reads a settled attribute. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('motion')
          if (q === 'on' || q === 'off') localStorage.setItem('zyflo-motion', q)
          if (localStorage.getItem('zyflo-motion') !== 'off') {
            document.documentElement.setAttribute('data-force-motion', '')
          }
        } catch (e) {
          // Storage can be blocked. Fall back to the default: motion on.
          document.documentElement.setAttribute('data-force-motion', '')
        }
      })()
    </script>

    <!--
      Title, description, robots, Open Graph, Twitter and the JSON-LD graph are
      injected here by the zyflo-seo plugin in vite.config.ts, generated from
      src/data/site.config.ts so they can never drift from the page copy.
      Absolute URLs (canonical, og:url, og:image) appear only once
      business.url is set to a real domain in that config file.
    -->
    <!--ZYFLO:HEAD-->

    <!-- Icons (self-hosted, generated from the logo) -->
    <!-- /favicon.ico also lives at the site root, because browsers and Google
         ask for that exact path whatever the page says. Every icon is the Z tile
         (the full logo is unreadable at 16px). The SVG stays sharp at any size,
         which is what Google search and modern browsers use; the PNGs are 48px
         multiples, as Google asks. The ?v= bumps past any old icon a browser
         cached. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/zyflo-tile.svg?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/icon-48.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png?v=3" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Geist and Geist Mono (Vercel, SIL OFL) are self-hosted from /public/fonts,
      so the page makes no third party request and the headline never swaps
      from a fallback face after load. Geist is one variable file for every
      weight, and it is what the first screen uses, so it is preloaded.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-variable.woff2" crossorigin />

    <style>
      /* Paint the ground before any CSS loads, which kills the flash of colour */
      html { background: #ffffff; }

      /* Each family is one variable file covering every weight. */
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/geist-variable.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/geist-mono-variable.woff2') format('woff2');
      }

      /* Until React mounts the page is plain white (no splash screen: it only
         added a beat before the site). The crawlable copy stays in the DOM,
         visually hidden. */
      #zyflo-static {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

    </style>
  </head>
  <body>
    <!--
      The block inside #root is a real, readable version of the page, generated
      from src/data/site.config.ts by the zyflo-seo plugin. Crawlers that do not
      run JavaScript (GPTBot, ClaudeBot, PerplexityBot, Google-Extended) and
      screen readers read it. It is clipped out of sight rather than hidden:
      no display:none and no aria-hidden, so it stays in the accessibility tree
      and in the text a crawler extracts. With JavaScript off, the noscript rule
      below shows it as an ordinary page. React's createRoot().render() clears
      #root on mount, taking this block with it.
      Do not move it out of #root.
    -->
    <noscript>
      <style>
        #zyflo-static {
          position: static !important;
          width: auto !important;
          height: auto !important;
          overflow: visible !important;
          clip-path: none !important;
          white-space: normal !important;
        }
      </style>
    </noscript>
    <div id="root"><!--ZYFLO:STATIC-FALLBACK--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
